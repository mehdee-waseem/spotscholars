# docker compose up web   → production build served by nginx on http://localhost:8080
# docker compose up dev   → Vite dev server with live reload on http://localhost:5173
services:
  web:
    build:
      context: .
      args:
        SYNC_CATALOGUE: "false"
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
