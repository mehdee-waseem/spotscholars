# Runs the test suite and a production build on every push and pull request.
# Netlify still does the deploy; this catches a broken data edit before it is merged.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # vite build directly: skips the Campus France download (prebuild) to keep CI fast
      - run: npx vite build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg SYNC_CATALOGUE=false -t spotscholars .
      - name: Start it and check the home page and a deep link
        run: |
          docker run -d -p 8080:80 --name site spotscholars
          sleep 3
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/programs | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = "404"
